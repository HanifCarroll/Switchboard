AWSTemplateFormatVersion: '2010-09-09'
Description: Switchboard hosting, controlled webhook delivery, change workflows, configuration, storage,
  queues, and observability.
Transform: ['AWS::LanguageExtensions', 'AWS::Serverless-2016-10-31']

Parameters:
  AlertEmail:
    Type: String
    Default: ''
    Description: Email recipient for operational alerts; SNS confirmation is required.

  ModelProvider:
    Type: String
    Default: bedrock
    AllowedValues:
      - deepseek
      - bedrock
    Description: Investigation worker model provider.

  BedrockModel:
    Type: String
    Default: minimax.minimax-m2.5
    AllowedValues:
      - deepseek.v3.2
      - openai.gpt-6-luna
      - minimax.minimax-m2.5
    Description: Model used when ModelProvider is bedrock.

  DailyJobLimit:
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 1000
    Description: Maximum new demo investigations per UTC day.

  VisitorDailyJobLimit:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 1000
    Description: Maximum new investigations per visitor per UTC day.

  ReserveConcurrency:
    Type: String
    Default: disabled
    AllowedValues:
      - enabled
      - disabled
    Description: Enable function reservations after raising the Lambda quota.

  SubmissionWindowLimit:
    Type: Number
    Default: 20
    MinValue: 1
    MaxValue: 1000
    Description: Maximum new demo investigations per five-minute UTC window.

Conditions:
  HasAlertEmail:
    Fn::Not:
      - Fn::Equals:
          - Ref: AlertEmail
          - ''

  DirectModel:
    Fn::Equals:
      - Ref: ModelProvider
      - deepseek

  BedrockModelEnabled:
    Fn::Equals:
      - Ref: ModelProvider
      - bedrock

  ConcurrencyReservations:
    Fn::Equals:
      - Ref: ReserveConcurrency
      - enabled


Resources:

  Database:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: switchboard
      BillingMode: PROVISIONED
      TableClass: STANDARD
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      ProvisionedThroughput:
        ReadCapacityUnits: 25
        WriteCapacityUnits: 25
      DeletionProtectionEnabled: true
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

  DeadLetters:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: switchboard-failed
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  Investigations:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: switchboard-investigations
      VisibilityTimeout: 1800
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt: [DeadLetters, Arn]
        maxReceiveCount: 5

  # API runtime and permissions.
  APILogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/switchboard-api
      RetentionInDays: 7

  APIRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: switchboard-api
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteFunctionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub:
                    arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/switchboard-api:*
              - Sid: ManageApplicationRecords
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:ConditionCheckItem
                  - dynamodb:Scan
                  - dynamodb:DeleteItem
                Resource:
                  Fn::GetAtt: [Database, Arn]
              - Sid: QueueInvestigations
                Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource:
                  Fn::GetAtt: [Investigations, Arn]
              - Sid: ReadFailedInvestigations
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource:
                  Fn::GetAtt: [DeadLetters, Arn]
              - Sid: PublishTraces
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'
              - Sid: ReadRuntimeSettings
                Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/switchboard/live/runtime
              - Sid: CompleteWorkflowTasks
                Effect: Allow
                Action:
                  - states:SendTaskSuccess
                  - states:SendTaskFailure
                Resource: '*'
              - Sid: StartChangeWorkflow
                Effect: Allow
                Action: states:StartExecution
                Resource:
                  Fn::Sub:
                    arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:switchboard-change-workflow
              - Sid: InvokeReceiverUrl
                Effect: Allow
                Action: lambda:InvokeFunctionUrl
                Resource:
                  Fn::Sub: ${Receiver.Arn}:live
                Condition:
                  StringEquals:
                    lambda:FunctionUrlAuthType: AWS_IAM
              - Sid: InvokeReceiverThroughUrl
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  Fn::Sub: ${Receiver.Arn}:live
                Condition:
                  Bool:
                    lambda:InvokedViaFunctionUrl: 'true'

  API:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: switchboard-api
      Role:
        Fn::GetAtt: [APIRole, Arn]
      Runtime: python3.12
      Handler: switchboard.lambda_handler.handler
      Timeout: 120
      MemorySize: 512
      Architectures:
        - x86_64
      LoggingConfig:
        LogFormat: JSON
        LogGroup:
          Ref: APILogs
        ApplicationLogLevel: INFO
      Layers: ['arn:aws:lambda:us-east-1:901920570463:layer:aws-otel-python-amd64-ver-1-32-0:7']
      Environment:
        Variables:
          DYNAMODB_TABLE:
            Ref: Database
          SWITCHBOARD_AUTH_MODE: demo
          SWITCHBOARD_RUNTIME: aws
          SWITCHBOARD_INVESTIGATION_MODE: live
          LANGCHAIN_TRACING_V2: 'false'
          LANGSMITH_TRACING: 'false'
          AWS_LAMBDA_EXEC_WRAPPER: /opt/otel-instrument
          OTEL_SERVICE_NAME: switchboard-api
          OTEL_METRICS_EXPORTER: none
          OTEL_LOGS_EXPORTER: none
          OTEL_PYTHON_DISABLED_INSTRUMENTATIONS: fastapi,httpx,requests,urllib,urllib3
          INVESTIGATION_QUEUE_URL:
            Ref: Investigations
          SWITCHBOARD_CONFIG_PARAMETER: /switchboard/live/runtime
          INVESTIGATION_DLQ_URL:
            Ref: DeadLetters
          INVESTIGATION_DAILY_LIMIT:
            Ref: DailyJobLimit
          INVESTIGATION_VISITOR_DAILY_LIMIT:
            Ref: VisitorDailyJobLimit
          INVESTIGATION_WINDOW_LIMIT:
            Ref: SubmissionWindowLimit
      ReservedConcurrentExecutions:
        Fn::If:
          - ConcurrencyReservations
          - 8
          - Ref: AWS::NoValue
      Tracing: Active
      CodeUri: ../backend/
      AutoPublishAlias: live
      AutoPublishAliasAllProperties: true
    Metadata:
      BuildMethod: python-uv

  # Investigation worker runtime and permissions.
  WorkerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/switchboard-worker
      RetentionInDays: 7

  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: switchboard-worker
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteFunctionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub:
                    arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/switchboard-worker:*
              - Sid: ManageInvestigationRecords
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:ConditionCheckItem
                  - dynamodb:DeleteItem
                Resource:
                  Fn::GetAtt: [Database, Arn]
              - Sid: ConsumeInvestigations
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource:
                  Fn::GetAtt: [Investigations, Arn]
              - Sid: PublishTraces
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'
              - Sid: RunApprovedModels
                Effect: Allow
                Action: bedrock-mantle:CreateInference
                Resource:
                  Fn::Sub: arn:aws:bedrock-mantle:${AWS::Region}:${AWS::AccountId}:project/default
                Condition:
                  StringEquals:
                    bedrock-mantle:Model:
                      - deepseek.v3.2
                      - openai.gpt-6-luna
                      - minimax.minimax-m2.5
                    bedrock-mantle:ServiceTier: default
              - Sid: ReadRuntimeSettings
                Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/switchboard/live/runtime
              - Sid: CompleteWorkflowTasks
                Effect: Allow
                Action:
                  - states:SendTaskSuccess
                  - states:SendTaskFailure
                Resource: '*'
              - Sid: ReadDeepSeekKey
                Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  Fn::Sub:
                    arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/switchboard/live/deepseek-api-key
              - Sid: DecryptDeepSeekKeyThroughSSM
                Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService:
                      Fn::Sub: ssm.${AWS::Region}.amazonaws.com
                    kms:EncryptionContext:PARAMETER_ARN:
                      Fn::Sub:
                        arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/switchboard/live/deepseek-api-key

  Worker:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: switchboard-worker
      Role:
        Fn::GetAtt: [WorkerRole, Arn]
      Runtime: python3.12
      Handler: switchboard.jobs.worker_handler
      Timeout: 300
      MemorySize: 1024
      Architectures:
        - x86_64
      LoggingConfig:
        LogFormat: JSON
        LogGroup:
          Ref: WorkerLogs
        ApplicationLogLevel: INFO
      Layers: ['arn:aws:lambda:us-east-1:901920570463:layer:aws-otel-python-amd64-ver-1-32-0:7']
      Environment:
        Variables:
          DYNAMODB_TABLE:
            Ref: Database
          SWITCHBOARD_AUTH_MODE: demo
          SWITCHBOARD_RUNTIME: aws
          SWITCHBOARD_INVESTIGATION_MODE: live
          LANGCHAIN_TRACING_V2: 'false'
          LANGSMITH_TRACING: 'false'
          AWS_LAMBDA_EXEC_WRAPPER: /opt/otel-instrument
          OTEL_SERVICE_NAME: switchboard-worker
          OTEL_METRICS_EXPORTER: none
          OTEL_LOGS_EXPORTER: none
          OTEL_PYTHON_DISABLED_INSTRUMENTATIONS: fastapi,httpx,requests,urllib,urllib3
          INVESTIGATION_QUEUE_URL:
            Ref: Investigations
          SWITCHBOARD_CONFIG_PARAMETER: /switchboard/live/runtime
          SWITCHBOARD_MODEL_PROVIDER:
            Ref: ModelProvider
          SWITCHBOARD_BEDROCK_MODEL:
            Fn::If:
              - BedrockModelEnabled
              - Ref: BedrockModel
              - Ref: AWS::NoValue
          DEEPSEEK_KEY_PARAMETER:
            Fn::If:
              - DirectModel
              - /switchboard/live/deepseek-api-key
              - Ref: AWS::NoValue
      ReservedConcurrentExecutions:
        Fn::If:
          - ConcurrencyReservations
          - 5
          - Ref: AWS::NoValue
      Tracing: Active
      CodeUri: ../backend/
      AutoPublishAlias: live
      AutoPublishAliasAllProperties: true
    Metadata:
      BuildMethod: python-uv

  # Website runtime and permissions.
  WebsiteLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/switchboard-website
      RetentionInDays: 7

  WebsiteRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: switchboard-website
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteFunctionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub:
                    arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/switchboard-website:*
              - Sid: PublishTraces
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'

  Website:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: switchboard-website
      Role:
        Fn::GetAtt: [WebsiteRole, Arn]
      Runtime: nodejs24.x
      Handler: run.sh
      Timeout: 30
      MemorySize: 512
      Architectures:
        - x86_64
      LoggingConfig:
        LogFormat: JSON
        LogGroup:
          Ref: WebsiteLogs
      Layers: ['arn:aws:lambda:us-east-1:753240598075:layer:LambdaAdapterLayerX86:30']
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_PORT: '8081'
          AWS_LWA_READINESS_CHECK_PATH: /work
          AWS_LWA_READINESS_CHECK_HEALTHY_STATUS: 200-399
          AWS_LWA_ENABLE_COMPRESSION: 'true'
          AWS_LWA_INVOKE_MODE: buffered
          NEXT_PUBLIC_AUTH_MODE: demo
          AWS_LWA_READINESS_CHECK_PORT: '8081'
          PORT: '8081'
      ReservedConcurrentExecutions:
        Fn::If:
          - ConcurrencyReservations
          - 6
          - Ref: AWS::NoValue
      Tracing: Active
      CodeUri: ../frontend/
      AutoPublishAlias: live
      AutoPublishAliasAllProperties: true
    Metadata:
      BuildMethod: makefile

  # Scheduled maintenance permissions.
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: switchboard-scheduler
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount:
                  Ref: AWS::AccountId
              ArnLike:
                aws:SourceArn:
                  Fn::Sub: arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule-group/default
      Policies:
        - PolicyName: InvokeMaintenance
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokeMaintenance
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  Fn::Sub: ${API.Arn}:live

  # GitHub deployment identity and permissions.
  GitHubOIDC:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  DeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: switchboard-deployment
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated:
                Ref: GitHubOIDC
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  repo:HanifCarroll@26860300/Switchboard@1375983110:ref:refs/heads/main
      Policies:
        - PolicyName: ReleaseExistingFunctions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReleaseFunctions
                Effect: Allow
                Action:
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetFunctionUrlConfig
                  - lambda:GetPolicy
                  - lambda:UpdateFunctionConfiguration
                  - lambda:UpdateFunctionCode
                  - lambda:PublishVersion
                  - lambda:GetAlias
                  - lambda:CreateAlias
                  - lambda:UpdateAlias
                  - 'lambda:DeleteAlias'
                  - 'lambda:ListTags'
                  - 'lambda:TagResource'
                  - 'lambda:UntagResource'
                  - lambda:ListVersionsByFunction
                  - lambda:GetRuntimeManagementConfig
                  - lambda:GetProvisionedConcurrencyConfig
                  - lambda:GetFunctionCodeSigningConfig
                  - lambda:GetFunctionRecursionConfig
                  - lambda:GetFunctionScalingConfig
                  - lambda:PutFunctionConcurrency
                  - lambda:DeleteFunctionConcurrency
                Resource:
                  - Fn::Sub: arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:switchboard-api
                  - Fn::Sub: arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:switchboard-api:*
                  - Fn::Sub: arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:switchboard-worker
                  - Fn::Sub: arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:switchboard-worker:*
                  - Fn::Sub: arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:switchboard-website
                  - Fn::Sub: arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:switchboard-website:*
                  - Fn::Sub: arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:switchboard-receiver
                  - Fn::Sub: arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:switchboard-receiver:*
              - Sid: UpdateStackThroughChangeSets
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:GetStackPolicy
                  - cloudformation:ListChangeSets
                  - cloudformation:DetectStackDrift
                  - cloudformation:DetectStackResourceDrift
                  - cloudformation:DescribeStackResourceDrifts
                  - cloudformation:UpdateStack
                  - cloudformation:GetTemplate
                  - cloudformation:DescribeStackEvents
                  - 'cloudformation:GetTemplateSummary'
                  - 'cloudformation:CreateChangeSet'
                  - 'cloudformation:DescribeChangeSet'
                  - 'cloudformation:ExecuteChangeSet'
                  - 'cloudformation:DeleteChangeSet'
                Resource:
                  - Ref: AWS::StackId
                  - Fn::Sub:
                      arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/samcli-deploy*/*
              - Sid: UseTemplateTransforms
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource:
                  - Fn::Sub: arn:aws:cloudformation:${AWS::Region}:aws:transform/LanguageExtensions
                  - Fn::Sub: arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              - Sid: ReadRuntimeRoles
                Effect: Allow
                Action: iam:GetRole
                Resource:
                  Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/switchboard-*
              - Sid: UpdateDeliveryDistribution
                Effect: Allow
                Action:
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:ListTagsForResource
                  - cloudfront:UpdateDistribution
                Resource:
                  Fn::Sub: arn:aws:cloudfront::${AWS::AccountId}:distribution/${Delivery}
              - Sid: UpdateOperationalDashboard
                Effect: Allow
                Action:
                  - cloudwatch:GetDashboard
                  - cloudwatch:PutDashboard
                Resource:
                  Fn::Sub: arn:aws:cloudwatch::${AWS::AccountId}:dashboard/switchboard
              - Sid: ReadWebsiteCertificate
                Effect: Allow
                Action:
                  - acm:DescribeCertificate
                  - acm:ListTagsForCertificate
                Resource:
                  Ref: WebsiteCertificate
              - Sid: ReadDeliveryPlan
                Effect: Allow
                Action: pricingplanmanager:GetSubscription
                Resource: '*'
              - Sid: InspectDatabase
                Effect: Allow
                Action: dynamodb:DescribeTable
                Resource:
                  Fn::GetAtt: [Database, Arn]
              - Sid: InspectQueues
                Effect: Allow
                Action: sqs:GetQueueAttributes
                Resource:
                  - Fn::GetAtt: [Investigations, Arn]
                  - Fn::GetAtt: [DeadLetters, Arn]
              - Sid: InspectFirewall
                Effect: Allow
                Action:
                  - wafv2:GetWebACL
                  - wafv2:ListTagsForResource
                Resource:
                  Fn::GetAtt: [Firewall, Arn]
              - Sid: ReadRuntimeLayers
                Effect: Allow
                Action: lambda:GetLayerVersion
                Resource:
                  - arn:aws:lambda:us-east-1:753240598075:layer:LambdaAdapterLayerX86:30
                  - arn:aws:lambda:us-east-1:901920570463:layer:aws-otel-python-amd64-ver-1-32-0:7
              - Sid: ListFunctionAliases
                Effect: Allow
                Action: lambda:ListAliases
                Resource:
                  - Fn::GetAtt: [API, Arn]
                  - Fn::GetAtt: [Worker, Arn]
                  - Fn::GetAtt: [Website, Arn]
                  - Fn::GetAtt: [Receiver, Arn]
              - Sid: PassRuntimeRolesToLambda
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - Fn::GetAtt: [APIRole, Arn]
                  - Fn::GetAtt: [WorkerRole, Arn]
                  - Fn::GetAtt: [WebsiteRole, Arn]
                  - Fn::GetAtt: [ReceiverRole, Arn]
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Sid: DeleteFunctionVersions
                Effect: Allow
                Action: lambda:DeleteFunction
                Resource:
                  - Fn::Sub: ${API.Arn}:*
                  - Fn::Sub: ${Worker.Arn}:*
                  - Fn::Sub: ${Website.Arn}:*
                  - Fn::Sub: ${Receiver.Arn}:*
              - Sid: InspectLambdaCapacity
                Effect: Allow
                Action: lambda:GetAccountSettings
                Resource: '*'
              - Sid: InspectDeploymentBucket
                Effect: Allow
                Action: ['s3:ListBucket', 's3:GetBucketLocation']
                Resource:
                  Fn::GetAtt: [DeploymentArtifacts, Arn]
              - Sid: ManageDeploymentArtifacts
                Effect: Allow
                Action: ['s3:GetObject', 's3:GetObjectVersion', 's3:PutObject', 's3:AbortMultipartUpload']
                Resource:
                  Fn::Sub: ${DeploymentArtifacts.Arn}/*
              - Sid: ReadRuntimeRolePolicies
                Effect: Allow
                Action: ['iam:GetRolePolicy']
                Resource:
                  Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/switchboard-*
              - Sid: ReadDriftDetectionStatus
                Effect: Allow
                Action: cloudformation:DescribeStackDriftDetectionStatus
                Resource: '*'
              - Sid: InspectStackResourcesForDrift
                Effect: Allow
                Action:
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:GetOpenIDConnectProvider
                  - logs:DescribeMetricFilters
                  - logs:ListTagsForResource
                  - logs:ListTagsLogGroup
                  - sns:GetTopicAttributes
                  - sns:GetSubscriptionAttributes
                  - sns:ListSubscriptionsByTopic
                  - sns:ListTagsForResource
                  - states:DescribeStateMachine
                  - states:ListTagsForResource
                  - ssm:GetParameter
                  - ssm:ListTagsForResource
                  - scheduler:GetSchedule
                  - scheduler:ListTagsForResource
                  - cloudfront:GetOriginAccessControl
                  - sqs:ListQueueTags
                  - dynamodb:ListTagsOfResource
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetEncryptionConfiguration
                  - s3:GetBucketVersioning
                  - s3:GetLifecycleConfiguration
                  - s3:GetBucketPolicy
                  - s3:GetBucketTagging
                  - dynamodb:DescribeContinuousBackups
                  - cloudwatch:ListTagsForResource
                Resource:
                  - Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/switchboard-*
                  - Ref: GitHubOIDC
                  - Fn::Sub: arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/switchboard-*
                  - Fn::Sub: arn:aws:cloudwatch::${AWS::AccountId}:dashboard/switchboard
                  - Ref: Alerts
                  - Ref: AlarmEvents
                  - Fn::Sub: arn:aws:sns:${AWS::Region}:${AWS::AccountId}:switchboard-alerts:*
                  - Fn::Sub: arn:aws:sns:${AWS::Region}:${AWS::AccountId}:switchboard-alarm-events:*
                  - Fn::Sub: arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:switchboard-change-workflow
                  - Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/switchboard/live/runtime
                  - Fn::Sub: arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/switchboard-maintenance
                  - Fn::Sub: arn:aws:cloudfront::${AWS::AccountId}:origin-access-control/${OriginAccess}
                  - Fn::GetAtt: [DeploymentArtifacts, Arn]
                  - Fn::GetAtt: [Database, Arn]
                  - Fn::GetAtt: [Investigations, Arn]
                  - Fn::GetAtt: [DeadLetters, Arn]
                  - Fn::Sub: arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:switchboard-*
              - Sid: ListLogsAndAlarmsForDrift
                Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - cloudwatch:DescribeAlarms
                  - ssm:DescribeParameters
                Resource: '*'
              - Sid: TagStackResources
                Effect: Allow
                Action:
                  - lambda:TagResource
                  - lambda:UntagResource
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:TagOpenIDConnectProvider
                  - iam:UntagOpenIDConnectProvider
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                  - sqs:TagQueue
                  - sqs:UntagQueue
                  - logs:TagResource
                  - logs:UntagResource
                  - sns:TagResource
                  - sns:UntagResource
                  - states:TagResource
                  - states:UntagResource
                  - ssm:AddTagsToResource
                  - ssm:RemoveTagsFromResource
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - wafv2:TagResource
                  - wafv2:UntagResource
                  - acm:AddTagsToCertificate
                  - acm:RemoveTagsFromCertificate
                  - s3:PutBucketTagging
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                Resource:
                  - Fn::Sub: arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:switchboard-*
                  - Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/switchboard-*
                  - Ref: GitHubOIDC
                  - Fn::GetAtt: [Database, Arn]
                  - Fn::GetAtt: [Investigations, Arn]
                  - Fn::GetAtt: [DeadLetters, Arn]
                  - Fn::Sub: arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/switchboard-*
                  - Ref: Alerts
                  - Ref: AlarmEvents
                  - Fn::Sub: arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:switchboard-change-workflow
                  - Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/switchboard/live/runtime
                  - Fn::Sub: arn:aws:cloudfront::${AWS::AccountId}:distribution/${Delivery}
                  - Fn::GetAtt: [Firewall, Arn]
                  - Ref: WebsiteCertificate
                  - Fn::GetAtt: [DeploymentArtifacts, Arn]
                  - Fn::Sub: arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:switchboard-*
              - Sid: InspectWorkerEventSourceForDrift
                Effect: Allow
                Action: lambda:GetEventSourceMapping
                Resource:
                  Fn::Sub: arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:event-source-mapping:${WorkerQueue}

  # Operational alerts, metrics, and dashboard.
  Alerts:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: switchboard-alerts
      DisplayName: Switchboard operational alerts

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn:
        Ref: Alerts
      Protocol: email
      Endpoint:
        Ref: AlertEmail

  APIErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: switchboard-APIErrors
      AlarmDescription: At least one API invocation failed in the last five minutes. Check the API logs and
        matching trace before retrying the action.
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmEvents
      Dimensions:
        - Name: FunctionName
          Value: switchboard-api

  WorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: switchboard-WorkerErrors
      AlarmDescription: At least one worker invocation failed in the last five minutes. SQS retries transient
        failures automatically. Check the worker logs and model access if the failure repeats.
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmEvents
      Dimensions:
        - Name: FunctionName
          Value: switchboard-worker

  WebsiteErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: switchboard-WebsiteErrors
      AlarmDescription: At least one website invocation failed in the last five minutes. Check the website
        logs and corresponding trace.
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmEvents
      Dimensions:
        - Name: FunctionName
          Value: switchboard-website

  QueueBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: switchboard-QueueBacklog
      AlarmDescription: The oldest queued investigation has waited over 15 minutes across two checks. Check
        worker concurrency, retry status, and queue visibility before submitting more work.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 900
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmEvents
      Dimensions:
        - Name: QueueName
          Value: switchboard-investigations

  DeadLetterJobsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: switchboard-DeadLetterJobs
      AlarmDescription: At least one investigation reached the dead-letter queue. Check its saved job state
        and worker logs. Maintenance records the failure; replay requires current access and workspace checks.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmEvents
      Dimensions:
        - Name: QueueName
          Value: switchboard-failed

  RejectedJobsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: switchboard-RejectedJobs
      AlarmDescription: At least one investigation failed access, input, or report validation in the last five
        minutes. The app stopped the investigation. Check worker logs and the saved job before starting
        another run.
      Namespace: Switchboard
      MetricName: FailedInvestigations
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmEvents

  FailedJobsMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName:
        Ref: WorkerLogs
      FilterPattern: '{ $.message = "Investigation rejected" }'
      MetricTransformations:
        - MetricNamespace: Switchboard
          MetricName: FailedInvestigations
          MetricValue: '1'
          DefaultValue: 0
          Unit: Count

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: switchboard
      DashboardBody:
        Fn::ToJsonString:
          widgets:
            - type: metric
              x: 0
              y: 0
              width: 24
              height: 6
              properties:
                title: Lambda invocations and errors
                region: us-east-1
                period: 300
                stat: Sum
                metrics:
                  - [AWS/Lambda, Invocations, FunctionName, switchboard-api]
                  - [AWS/Lambda, Errors, FunctionName, switchboard-api]
                  - [AWS/Lambda, Throttles, FunctionName, switchboard-api]
                  - [AWS/Lambda, Invocations, FunctionName, switchboard-worker]
                  - [AWS/Lambda, Errors, FunctionName, switchboard-worker]
                  - [AWS/Lambda, Throttles, FunctionName, switchboard-worker]
                  - [AWS/Lambda, Invocations, FunctionName, switchboard-website]
                  - [AWS/Lambda, Errors, FunctionName, switchboard-website]
                  - [AWS/Lambda, Throttles, FunctionName, switchboard-website]
                  - [AWS/Lambda, Invocations, FunctionName, switchboard-receiver]
                  - [AWS/Lambda, Errors, FunctionName, switchboard-receiver]
                  - [AWS/Lambda, Throttles, FunctionName, switchboard-receiver]
            - type: metric
              x: 0
              y: 6
              width: 24
              height: 6
              properties:
                title: Lambda duration
                region: us-east-1
                period: 300
                stat: p95
                metrics:
                  - [AWS/Lambda, Duration, FunctionName, switchboard-api]
                  - [AWS/Lambda, Duration, FunctionName, switchboard-worker]
                  - [AWS/Lambda, Duration, FunctionName, switchboard-website]
                  - [AWS/Lambda, Duration, FunctionName, switchboard-receiver]
            - type: metric
              x: 0
              y: 12
              width: 24
              height: 6
              properties:
                title: Investigation queues
                region: us-east-1
                period: 300
                stat: Maximum
                metrics:
                  - [AWS/SQS, ApproximateNumberOfMessagesVisible, QueueName, switchboard-investigations]
                  - [AWS/SQS, ApproximateNumberOfMessagesNotVisible, QueueName, switchboard-investigations]
                  - [AWS/SQS, ApproximateAgeOfOldestMessage, QueueName, switchboard-investigations]
                  - [AWS/SQS, ApproximateNumberOfMessagesVisible, QueueName, switchboard-failed]
                  - [AWS/SQS, ApproximateNumberOfMessagesNotVisible, QueueName, switchboard-failed]
                  - [AWS/SQS, ApproximateAgeOfOldestMessage, QueueName, switchboard-failed]
            - type: metric
              x: 0
              y: 18
              width: 24
              height: 6
              properties:
                title: DynamoDB capacity and throttling
                region: us-east-1
                period: 300
                stat: Sum
                metrics:
                  - [AWS/DynamoDB, ConsumedReadCapacityUnits, TableName, switchboard]
                  - [AWS/DynamoDB, ConsumedWriteCapacityUnits, TableName, switchboard]
                  - [AWS/DynamoDB, ReadThrottleEvents, TableName, switchboard]
                  - [AWS/DynamoDB, WriteThrottleEvents, TableName, switchboard]
            - type: metric
              x: 0
              y: 24
              width: 24
              height: 6
              properties:
                title: Regional Lambda concurrency
                region: us-east-1
                period: 300
                stat: Maximum
                metrics:
                  - [AWS/Lambda, ConcurrentExecutions]
                  - [AWS/Lambda, ClaimedAccountConcurrency]
            - type: metric
              x: 0
              y: 30
              width: 24
              height: 6
              properties:
                title: Rejected investigations
                region: us-east-1
                period: 300
                stat: Sum
                metrics:
                  - [Switchboard, FailedInvestigations]
            - type: metric
              x: 0
              y: 36
              width: 24
              height: 6
              properties:
                title: Change workflows
                region: us-east-1
                period: 300
                stat: Sum
                metrics:
                  - [AWS/States, ExecutionsStarted, StateMachineArn, {Ref: Workflow}]
                  - [AWS/States, ExecutionsSucceeded, StateMachineArn, {Ref: Workflow}]
                  - [AWS/States, ExecutionsFailed, StateMachineArn, {Ref: Workflow}]
                  - [AWS/States, ExecutionsTimedOut, StateMachineArn, {Ref: Workflow}]

  AlertsPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - Ref: AlarmEvents
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource:
              Ref: AlarmEvents
            Condition:
              StringEquals:
                aws:SourceAccount:
                  Ref: AWS::AccountId
              ArnLike:
                aws:SourceArn:
                  Fn::Sub: arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:switchboard-*

  # Protected function URLs and event sources.
  APIUrl:
    Type: AWS::Lambda::Url
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TargetFunctionArn:
        Fn::GetAtt: [API, Arn]
      Qualifier: live
      AuthType: AWS_IAM
      InvokeMode: BUFFERED
    DependsOn: APIAliaslive

  APIUrlPermission:
    Type: AWS::Lambda::Permission
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName:
        Fn::Sub: ${API.Arn}:live
      Action: lambda:InvokeFunctionUrl
      Principal: cloudfront.amazonaws.com
      SourceArn:
        Fn::Sub: arn:aws:cloudfront::${AWS::AccountId}:distribution/${Delivery}
      FunctionUrlAuthType: AWS_IAM
    DependsOn: APIAliaslive

  APIInvokePermission:
    Type: AWS::Lambda::Permission
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName:
        Fn::Sub: ${API.Arn}:live
      Action: lambda:InvokeFunction
      Principal: cloudfront.amazonaws.com
      SourceArn:
        Fn::Sub: arn:aws:cloudfront::${AWS::AccountId}:distribution/${Delivery}
      InvokedViaFunctionUrl: true
    DependsOn: APIAliaslive

  WebsiteUrl:
    Type: AWS::Lambda::Url
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TargetFunctionArn:
        Fn::GetAtt: [Website, Arn]
      Qualifier: live
      AuthType: AWS_IAM
      InvokeMode: BUFFERED
    DependsOn: WebsiteAliaslive

  WebsiteUrlPermission:
    Type: AWS::Lambda::Permission
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName:
        Fn::Sub: ${Website.Arn}:live
      Action: lambda:InvokeFunctionUrl
      Principal: cloudfront.amazonaws.com
      SourceArn:
        Fn::Sub: arn:aws:cloudfront::${AWS::AccountId}:distribution/${Delivery}
      FunctionUrlAuthType: AWS_IAM
    DependsOn: WebsiteAliaslive

  WebsiteInvokePermission:
    Type: AWS::Lambda::Permission
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName:
        Fn::Sub: ${Website.Arn}:live
      Action: lambda:InvokeFunction
      Principal: cloudfront.amazonaws.com
      SourceArn:
        Fn::Sub: arn:aws:cloudfront::${AWS::AccountId}:distribution/${Delivery}
      InvokedViaFunctionUrl: true
    DependsOn: WebsiteAliaslive

  WorkerQueue:
    Type: AWS::Lambda::EventSourceMapping
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName:
        Fn::Sub: ${Worker.Arn}:live
      EventSourceArn:
        Fn::GetAtt: [Investigations, Arn]
      BatchSize: 1
      MaximumBatchingWindowInSeconds: 0
      Enabled: true
      ScalingConfig:
        MaximumConcurrency: 2
    DependsOn: WorkerAliaslive

  Maintenance:
    Type: AWS::Scheduler::Schedule
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: switchboard-maintenance
      GroupName: default
      ScheduleExpression: rate(1 hour)
      ScheduleExpressionTimezone: UTC
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: ENABLED
      Target:
        Arn:
          Fn::Sub: ${API.Arn}:live
        Input: '{"source":"switchboard.maintenance"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 3600
          MaximumRetryAttempts: 2
        RoleArn:
          Fn::GetAtt: [SchedulerRole, Arn]
    DependsOn: APIAliaslive

  # Public delivery, firewall, and certificate.
  OriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      OriginAccessControlConfig:
        Name: switchboard-lambda
        Description: Protect Switchboard Lambda URLs
        SigningProtocol: sigv4
        SigningBehavior: always
        OriginAccessControlOriginType: lambda

  Firewall:
    Type: AWS::WAFv2::WebACL
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: switchboard
      DefaultAction:
        Allow: {}
      Rules:
        - Name: LimitAPIRequests
          Priority: 0
          Statement:
            RateBasedStatement:
              Limit: 1000
              EvaluationWindowSec: 300
              AggregateKeyType: IP
          Action:
            Block: {}
          VisibilityConfig:
            SampledRequestsEnabled: false
            CloudWatchMetricsEnabled: false
            MetricName: switchboard-api-limit
      VisibilityConfig:
        SampledRequestsEnabled: false
        CloudWatchMetricsEnabled: false
        MetricName: switchboard
      Scope: CLOUDFRONT

  WebsiteCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: switchboard.hanifcarroll.com
      ValidationMethod: DNS
      CertificateExport: DISABLED

  Delivery:
    Type: AWS::CloudFront::Distribution
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DistributionConfig:
        Aliases:
          - switchboard.hanifcarroll.com
        DefaultRootObject: ''
        Origins:
          - Id: website
            DomainName:
              Fn::Select:
                - 2
                - Fn::Split:
                    - /
                    - Fn::GetAtt: [WebsiteUrl, FunctionUrl]
            OriginPath: ''
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginReadTimeout: 30
              OriginKeepaliveTimeout: 5
              OriginSSLProtocols:
                - TLSv1.2
            ConnectionAttempts: 1
            ConnectionTimeout: 10
            OriginAccessControlId:
              Ref: OriginAccess
          - Id: api
            DomainName:
              Fn::Select:
                - 2
                - Fn::Split:
                    - /
                    - Fn::GetAtt: [APIUrl, FunctionUrl]
            OriginPath: ''
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginReadTimeout: 30
              OriginKeepaliveTimeout: 5
              OriginSSLProtocols:
                - TLSv1.2
            ConnectionAttempts: 1
            ConnectionTimeout: 10
            OriginAccessControlId:
              Ref: OriginAccess
        DefaultCacheBehavior:
          TargetOriginId: website
          TrustedSigners: []
          TrustedKeyGroups: []
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - HEAD
            - GET
            - OPTIONS
          SmoothStreaming: false
          Compress: true
          LambdaFunctionAssociations: []
          FunctionAssociations: []
          FieldLevelEncryptionId: ''
          # AWS managed CachingDisabled: forward each request to the origin.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # AWS managed AllViewerExceptHostHeader: use the Lambda origin host.
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          GrpcConfig:
            Enabled: false
          CachedMethods:
            - HEAD
            - GET
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            TrustedSigners: []
            TrustedKeyGroups: []
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - HEAD
              - DELETE
              - POST
              - GET
              - OPTIONS
              - PUT
              - PATCH
            SmoothStreaming: false
            Compress: true
            LambdaFunctionAssociations: []
            FunctionAssociations: []
            FieldLevelEncryptionId: ''
            # AWS managed CachingDisabled: forward each request to the origin.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # AWS managed AllViewerExceptHostHeader: use the Lambda origin host.
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            GrpcConfig:
              Enabled: false
            CachedMethods:
              - HEAD
              - GET
          - PathPattern: /_next/static/*
            TargetOriginId: website
            TrustedSigners: []
            TrustedKeyGroups: []
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - HEAD
              - GET
              - OPTIONS
            SmoothStreaming: false
            Compress: true
            LambdaFunctionAssociations: []
            FunctionAssociations: []
            FieldLevelEncryptionId: ''
            # AWS managed CachingOptimized: cache versioned Next.js assets.
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            # AWS managed AllViewerExceptHostHeader: use the Lambda origin host.
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            GrpcConfig:
              Enabled: false
            CachedMethods:
              - HEAD
              - GET
        Comment: Switchboard AWS
        PriceClass: PriceClass_All
        Enabled: true
        ViewerCertificate:
          AcmCertificateArn:
            Ref: WebsiteCertificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Restrictions:
          GeoRestriction:
            RestrictionType: none
        WebACLId:
          Fn::GetAtt: [Firewall, Arn]
        HttpVersion: http2
        IPV6Enabled: true

  DeliveryPlan:
    Type: AWS::PricingPlanManager::Subscription
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PlanFamily: CloudFront
      PlanTier: FREE
      ResourceArns:
        - Fn::Sub: arn:aws:cloudfront::${AWS::AccountId}:distribution/${Delivery}
        - Fn::GetAtt: [Firewall, Arn]

  # Signed webhook receiver runtime and permissions.
  ReceiverLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/switchboard-receiver
      RetentionInDays: 7

  ReceiverRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: switchboard-receiver
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteFunctionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub:
                    arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/switchboard-receiver:*
              - Sid: ReadAndSaveDeliveryReceipts
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource:
                  Fn::GetAtt: [Database, Arn]
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys:
                      - WS#*#GEN#*
              - Sid: PublishTraces
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'

  Receiver:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: switchboard-receiver
      Role:
        Fn::GetAtt: [ReceiverRole, Arn]
      Runtime: python3.12
      Handler: switchboard.receiver.handler
      Timeout: 15
      MemorySize: 512
      Architectures:
        - x86_64
      LoggingConfig:
        LogFormat: JSON
        LogGroup:
          Ref: ReceiverLogs
        ApplicationLogLevel: INFO
      Layers: ['arn:aws:lambda:us-east-1:901920570463:layer:aws-otel-python-amd64-ver-1-32-0:7']
      Environment:
        Variables:
          DYNAMODB_TABLE:
            Ref: Database
          SWITCHBOARD_AUTH_MODE: demo
          SWITCHBOARD_RUNTIME: aws
          SWITCHBOARD_INVESTIGATION_MODE: live
          LANGCHAIN_TRACING_V2: 'false'
          LANGSMITH_TRACING: 'false'
          AWS_LAMBDA_EXEC_WRAPPER: /opt/otel-instrument
          OTEL_SERVICE_NAME: switchboard-receiver
          OTEL_METRICS_EXPORTER: none
          OTEL_LOGS_EXPORTER: none
          OTEL_PYTHON_DISABLED_INSTRUMENTATIONS: fastapi,httpx,requests,urllib,urllib3
          INVESTIGATION_QUEUE_URL:
            Ref: Investigations
      ReservedConcurrentExecutions:
        Fn::If:
          - ConcurrencyReservations
          - 2
          - Ref: AWS::NoValue
      Tracing: Active
      CodeUri: ../backend/
      AutoPublishAlias: live
      AutoPublishAliasAllProperties: true
    Metadata:
      BuildMethod: python-uv

  ReceiverUrl:
    Type: AWS::Lambda::Url
    DependsOn: ReceiverAliaslive
    Properties:
      TargetFunctionArn:
        Ref: Receiver
      Qualifier: live
      AuthType: AWS_IAM
      InvokeMode: BUFFERED

  # Change workflow and runtime configuration.
  WorkflowRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: switchboard-workflow
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount:
                  Ref: AWS::AccountId
              ArnEquals:
                aws:SourceArn:
                  Fn::Sub:
                    arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:switchboard-change-workflow
      Policies:
        - PolicyName: AdvanceWorkflow
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokeWorkflowOperations
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  Fn::Sub: ${API.Arn}:live
              - Sid: QueueInvestigations
                Effect: Allow
                Action: sqs:SendMessage
                Resource:
                  Fn::GetAtt: [Investigations, Arn]
              - Sid: PublishAndSampleTraces
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: '*'

  Workflow:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: switchboard-change-workflow
      StateMachineType: STANDARD
      RoleArn:
        Fn::GetAtt: [WorkflowRole, Arn]
      TracingConfiguration:
        Enabled: true
      Definition:
        StartAt: Resolve
        TimeoutSeconds: 86400
        States:
          Resolve:
            Type: Task
            Resource:
              Fn::Sub: ${API.Arn}:live
            Parameters:
              source: switchboard.workflow
              operation: resolve
              workflow.$: $
            ResultPath: $.resolved
            Retry:
              - ErrorEquals:
                  - Lambda.ServiceException
                  - Lambda.AWSLambdaException
                  - Lambda.SdkClientException
                  - Lambda.TooManyRequestsException
                IntervalSeconds: 2
                MaxAttempts: 2
                BackoffRate: 2
            Next: NeedsInvestigation
          NeedsInvestigation:
            Type: Choice
            Choices:
              - Variable: $.resolved.investigate
                BooleanEquals: true
                Next: Investigate
            Default: ReviewOutcome
          Investigate:
            Type: Task
            Resource: arn:aws:states:::sqs:sendMessage.waitForTaskToken
            Parameters:
              QueueUrl:
                Ref: Investigations
              MessageBody:
                workspace_id.$: $.workspace_id
                generation.$: $.generation
                run_id.$: $.run_id
                task_token.$: $$.Task.Token
            TimeoutSeconds: 10800
            ResultPath: $.resolved
            Next: ReviewOutcome
          ReviewOutcome:
            Type: Choice
            Choices:
              - Variable: $.resolved.outcome
                StringEquals: blocked
                Next: Blocked
              - Variable: $.resolved.environment
                StringEquals: production
                Next: AwaitApproval
            Default: AwaitExecution
          Blocked:
            Type: Succeed
          ReviewDelivery:
            Type: Choice
            Choices:
              - Variable: $.verification.outcome
                StringEquals: delivered
                Next: Delivered
            Default: ManualIntervention
          Delivered:
            Type: Succeed
          ManualIntervention:
            Type: Fail
            Error: DeliveryUnconfirmed
            Cause: Review the saved verification receipt before taking further action.
          AwaitApproval:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke.waitForTaskToken
            Parameters:
              FunctionName:
                Fn::Sub: ${API.Arn}:live
              Payload:
                source: switchboard.workflow
                operation: wait
                stage: approval
                task_token.$: $$.Task.Token
                workflow:
                  workspace_id.$: $.workspace_id
                  generation.$: $.generation
                  run_id.$: $.run_id
            TimeoutSeconds: 86400
            ResultPath: $.approval
            Retry:
              - ErrorEquals:
                  - Lambda.ServiceException
                  - Lambda.AWSLambdaException
                  - Lambda.SdkClientException
                  - Lambda.TooManyRequestsException
                IntervalSeconds: 2
                MaxAttempts: 2
                BackoffRate: 2
            Next: AwaitExecution
          AwaitExecution:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke.waitForTaskToken
            Parameters:
              FunctionName:
                Fn::Sub: ${API.Arn}:live
              Payload:
                source: switchboard.workflow
                operation: wait
                stage: execution
                task_token.$: $$.Task.Token
                workflow:
                  workspace_id.$: $.workspace_id
                  generation.$: $.generation
                  run_id.$: $.run_id
            TimeoutSeconds: 86400
            ResultPath: $.execution
            Retry:
              - ErrorEquals:
                  - Lambda.ServiceException
                  - Lambda.AWSLambdaException
                  - Lambda.SdkClientException
                  - Lambda.TooManyRequestsException
                IntervalSeconds: 2
                MaxAttempts: 2
                BackoffRate: 2
            Next: AwaitVerification
          AwaitVerification:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke.waitForTaskToken
            Parameters:
              FunctionName:
                Fn::Sub: ${API.Arn}:live
              Payload:
                source: switchboard.workflow
                operation: wait
                stage: verification
                task_token.$: $$.Task.Token
                workflow:
                  workspace_id.$: $.workspace_id
                  generation.$: $.generation
                  run_id.$: $.run_id
            TimeoutSeconds: 86400
            ResultPath: $.verification
            Retry:
              - ErrorEquals:
                  - Lambda.ServiceException
                  - Lambda.AWSLambdaException
                  - Lambda.SdkClientException
                  - Lambda.TooManyRequestsException
                IntervalSeconds: 2
                MaxAttempts: 2
                BackoffRate: 2
            Next: ReviewDelivery
    DependsOn: APIAliaslive

  RuntimeSettings:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /switchboard/live/runtime
      Type: String
      Tier: Standard
      Description: Controlled receiver and change workflow addresses
      Value:
        Fn::ToJsonString:
          receiver_url:
            Fn::GetAtt: [ReceiverUrl, FunctionUrl]
          state_machine_arn:
            Ref: Workflow

  # Receiver and workflow alarms.
  ReceiverErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: switchboard-ReceiverErrors
      AlarmDescription: At least one webhook receiver invocation failed in the last five minutes. Check the
        receiver logs and saved delivery-verification receipt. An uncertain result requires manual
        investigation.
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmEvents
      Dimensions:
        - Name: FunctionName
          Value: switchboard-receiver

  WorkflowFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: switchboard-WorkflowFailures
      AlarmDescription: At least one change workflow failed in the last five minutes. Open its Step Functions
        execution and review saved action receipts. Workflow failure does not establish that a configuration
        change occurred; do not repeat an action blindly.
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmEvents
      Dimensions:
        - Name: StateMachineArn
          Value:
            Ref: Workflow

  WorkflowTimeoutsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: switchboard-WorkflowTimeouts
      AlarmDescription: At least one workflow reached its 24-hour limit. Review its Step Functions history and
        saved action receipts. Approval, execution, and verification are separate manual actions.
      Namespace: AWS/States
      MetricName: ExecutionsTimedOut
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmEvents
      Dimensions:
        - Name: StateMachineArn
          Value:
            Ref: Workflow

  # Readable email notification delivery.
  AlarmEvents:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: switchboard-alarm-events

  NotificationLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/switchboard-notifications
      RetentionInDays: 7

  NotificationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: switchboard-notifications
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteFunctionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub:
                    arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/switchboard-notifications:*
              - Sid: PublishAlertEmails
                Effect: Allow
                Action: sns:Publish
                Resource:
                  Ref: Alerts
              - Sid: PublishTraces
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'

  Notifications:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: switchboard-notifications
      Runtime: python3.12
      Handler: index.handler
      Timeout: 15
      MemorySize: 128
      Role:
        Fn::GetAtt: [NotificationRole, Arn]
      Code:
        ZipFile: |
          import json
          import os
          from datetime import datetime, timezone
          from urllib.parse import quote

          import boto3

          sns = boto3.client("sns")

          TITLES = {
              "switchboard-Throttles": "Traffic exceeded available capacity",
              "switchboard-APIErrors": "An API request failed",
              "switchboard-WorkerErrors": "An investigation needs a retry",
              "switchboard-WebsiteErrors": "The website returned an error",
              "switchboard-ReceiverErrors": "The delivery receiver returned an error",
              "switchboard-QueueBacklog": "Investigations are waiting too long",
              "switchboard-DeadLetterJobs": "An investigation exhausted its retries",
              "switchboard-RejectedJobs": "An investigation was rejected",
              "switchboard-WorkflowFailures": "A change workflow failed",
              "switchboard-WorkflowTimeouts": "A change workflow timed out",
          }


          def handler(event, context):
              for record in event["Records"]:
                  # 1. Read the alarm metadata without forwarding the raw metric payload.
                  alarm = json.loads(record["Sns"]["Message"])
                  name = alarm["AlarmName"]
                  title = TITLES.get(name, "An operational alert needs review")
                  detected = datetime.fromisoformat(alarm["StateChangeTime"]).astimezone(
                      timezone.utc
                  )

                  # 2. Describe the problem and link directly to investigation steps.
                  preview = alarm.get("TestNotification", False)
                  heading = (
                      "Formatting preview: no new failure was detected."
                      if preview
                      else "Switchboard needs attention"
                  )
                  link = (
                      "https://us-east-1.console.aws.amazon.com/cloudwatch/home?region=us-east-1"
                      "#alarmsV2:alarm/" + quote(name, safe="")
                  )
                  message = (
                      heading
                      + "\n\n"
                      + title
                      + "\n\n"
                      + alarm["AlarmDescription"]
                      + "\n\n"
                      + "Detected: "
                      + detected.strftime("%d %b %Y, %H:%M UTC")
                      + "\n\n"
                      + "Open the alarm:\n"
                      + link
                      + "\n\n"
                      + "Troubleshooting guide:\n"
                      + "https://github.com/HanifCarroll/Switchboard/blob/main/aws/README.md"
                  )

                  # 3. Deliver through the existing confirmed email subscription.
                  sns.publish(
                      TopicArn=os.environ["ALERTS_TOPIC_ARN"],
                      Subject=("TEST — " if preview else "") + "Switchboard: " + title,
                      Message=message,
                  )
              return {"formatted": len(event["Records"])}
      Environment:
        Variables:
          ALERTS_TOPIC_ARN:
            Ref: Alerts
      LoggingConfig:
        LogFormat: JSON
        LogGroup:
          Ref: NotificationLogs
        ApplicationLogLevel: INFO
      TracingConfig:
        Mode: Active
      ReservedConcurrentExecutions:
        Fn::If:
          - ConcurrencyReservations
          - 1
          - Ref: AWS::NoValue

  NotificationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: Notifications
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn:
        Ref: AlarmEvents
      SourceAccount:
        Ref: AWS::AccountId

  NotificationSubscription:
    Type: AWS::SNS::Subscription
    DependsOn: NotificationPermission
    Properties:
      TopicArn:
        Ref: AlarmEvents
      Protocol: lambda
      Endpoint:
        Fn::GetAtt: [Notifications, Arn]

  # Account capacity alarm.
  ThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: switchboard-Throttles
      AlarmDescription: Lambda rejected work because concurrency was exhausted. Check account capacity and
        function reservations in the operations guide.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmEvents

  # Deployment artifact storage.
  DeploymentArtifacts:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName:
        Fn::Sub: switchboard-deployments-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  DeploymentArtifactsPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: DeploymentArtifacts
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - Fn::GetAtt: [DeploymentArtifacts, Arn]
              - Fn::Sub: ${DeploymentArtifacts.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

Outputs:
  # Storage and investigation queues.
  Database:
    Value:
      Ref: Database

  Investigations:
    Value:
      Ref: Investigations

  DeadLetters:
    Value:
      Ref: DeadLetters

  APIArn:
    Value:
      Fn::GetAtt: [API, Arn]

  WorkerArn:
    Value:
      Fn::GetAtt: [Worker, Arn]

  WebsiteArn:
    Value:
      Fn::GetAtt: [Website, Arn]

  SchedulerRoleArn:
    Value:
      Fn::GetAtt: [SchedulerRole, Arn]

  DeploymentRoleArn:
    Value:
      Fn::GetAtt: [DeploymentRole, Arn]

  AlertsArn:
    Value:
      Ref: Alerts

  ReceiverArn:
    Value:
      Fn::GetAtt: [Receiver, Arn]

  ReceiverURL:
    Value:
      Fn::GetAtt: [ReceiverUrl, FunctionUrl]

  WorkflowArn:
    Value:
      Ref: Workflow

  RuntimeParameter:
    Value:
      Ref: RuntimeSettings

  ModelKeyParameter:
    Value: /switchboard/live/deepseek-api-key

  DeliveryURL:
    Value: https://switchboard.hanifcarroll.com

  DeliveryId:
    Value:
      Ref: Delivery

  DeliveryPlanArn:
    Value:
      Fn::GetAtt: [DeliveryPlan, Arn]

  DeploymentBucket:
    Value:
      Ref: DeploymentArtifacts
