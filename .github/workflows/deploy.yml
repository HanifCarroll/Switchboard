name: Validate and deploy AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: switchboard-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check backend
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright
          uv run pytest -v
          uv run ruff check ../scripts/aws.py ../scripts/verify_aws.py
          uv run ruff check ../scripts/sam_artifacts.py
          uv run ruff format --check ../scripts/aws.py ../scripts/verify_aws.py ../scripts/sam_artifacts.py
          uv run pyright --project . ../scripts/aws.py ../scripts/verify_aws.py ../scripts/sam_artifacts.py

      - name: Validate infrastructure
        working-directory: backend
        run: uvx cfn-lint==1.53.3 --registry-schemas ../aws/schemas --regions us-east-1 --template ../aws/template.yml

      - name: Check frontend
        working-directory: frontend
        run: |
          npm test
          npm run lint
          npm run format:check
          npm run build

      - name: Check repository diff
        run: git diff --check

  deploy:
    needs: validate
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - name: Set up SAM
        uses: aws-actions/setup-sam@v2
        with:
          version: 1.166.2
      - name: Assume repository-scoped deployment role
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Build with SAM and retain previous website assets
        working-directory: backend
        run: uv run python ../scripts/aws.py build
      - name: Deploy with SAM, check live application, and roll back on failure
        working-directory: backend
        run: uv run python ../scripts/aws.py release
      - name: Save release receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aws-release-receipts
          path: |
            aws/local/packaging.json
            aws/local/previous-template.yml
            aws/local/previous-deployment.json
            aws/local/deployment-health.json
